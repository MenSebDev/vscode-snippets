---
# Release VS Code snippet extensions.

name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "snippets/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create version PR and publish
        uses: changesets/action@v1
        with:
          version: pnpm run vscode:version
          publish: pnpm run vscode:publish
          commit: "chore(release): update snippet extension versions"
          title: "chore(release): update snippet extension versions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
